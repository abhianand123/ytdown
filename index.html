<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniDownloader - Connecting to Phone Server...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #09090b;
      color: #fafafa;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(168, 85, 247, 0.15);
    }
    .loader {
      width: 44px;
      height: 44px;
      border: 4px solid #27272a;
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 0.875rem; color: #a1a1aa; line-height: 1.5; }
    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 20px;
      background: #9333ea;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="loader" id="spinner"></div>
    <h1>Connecting to Phone Server...</h1>
    <p id="status-text">Fetching latest active tunnel...</p>
    <a id="direct-btn" href="#" class="btn" style="display:none;">Open Downloader</a>
  </div>

  <script>
    fetch('url.txt?t=' + Date.now())
      .then(r => r.text())
      .then(url => {
        url = url.trim();
        if (url && url.startsWith('http')) {
          document.getElementById('status-text').textContent = "Redirecting to your phone...";
          document.getElementById('direct-btn').href = url;
          document.getElementById('direct-btn').style.display = 'inline-block';
          window.location.replace(url);
        } else {
          throw new Error();
        }
      })
      .catch(() => {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('status-text').innerHTML = "Server is currently offline or restarting.<br>Please wait a moment.";
      });
  </script>
</body>
</html>
