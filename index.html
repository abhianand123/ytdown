<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniDownloader - Connecting to Phone Server...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #09090b;
      color: #fafafa;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(168, 85, 247, 0.15);
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 4px solid #27272a;
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 0.875rem; color: #a1a1aa; line-height: 1.5; }
    .url-box {
      margin-top: 20px;
      padding: 12px;
      background: #09090b;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #c084fc;
      word-break: break-all;
    }
    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 20px;
      background: #9333ea;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="loader" id="spinner"></div>
    <h1>OmniDownloader Bridge</h1>
    <p id="status-text">Fetching latest live tunnel from phone...</p>
    <div id="target-url" class="url-box" style="display:none;"></div>
    <a id="direct-btn" href="#" class="btn" style="display:none;">Open Downloader Directly</a>
  </div>

  <script>
    const statusText = document.getElementById('status-text');
    const targetUrlBox = document.getElementById('target-url');
    const directBtn = document.getElementById('direct-btn');
    const spinner = document.getElementById('spinner');

    // Fetch url.txt with cache busting
    fetch('url.txt?t=' + Date.now())
      .then(response => {
        if (!response.ok) throw new Error("Status " + response.status);
        return response.text();
      })
      .then(text => {
        const url = text.trim();
        if (url && url.startsWith('http')) {
          statusText.textContent = "Live server found! Redirecting...";
          targetUrlBox.textContent = url;
          targetUrlBox.style.display = 'block';
          directBtn.href = url;
          directBtn.style.display = 'inline-block';
          // Instant redirect
          setTimeout(() => {
            window.location.replace(url);
          }, 600);
        } else {
          throw new Error("No valid tunnel URL found in url.txt");
        }
      })
      .catch(err => {
        spinner.style.display = 'none';
        statusText.innerHTML = "Server is currently offline or restarting.<br><br>Make sure your phone server is running.";
      });
  </script>
</body>
</html>
